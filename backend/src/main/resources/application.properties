quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=https://app.motoria.ai,https://admin.motoria.ai,https://backoffice.motoria.ai
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600
quarkus.http.limits.max-body-size=20M
quarkus.http.auth.proactive=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${MOTORIA_DB_USER}
quarkus.datasource.password=${MOTORIA_DB_PASSWORD}
quarkus.datasource.jdbc.url=${MOTORIA_DB_URL}

# Schema changes only through Flyway migrations (design D2). Existing databases created with
# generation=update are baselined at version 1 (V1 mirrors that schema).
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.locations=db/migration

# Identity provider: Keycloak (OIDC). MOTORIA_OIDC_URL points to the realm, e.g. https://host/realms/motoria.
# The user id is the Keycloak sub claim (UUID); roles are realm roles in realm_access.roles.
quarkus.oidc.auth-server-url=${MOTORIA_OIDC_URL}
quarkus.oidc.client-id=motoria-backend
quarkus.oidc.credentials.secret=${MOTORIA_OIDC_SECRET}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles

mp.messaging.outgoing.motoria-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.motoria-events-out.exchange.name=motoria.events
mp.messaging.outgoing.motoria-events-out.host=${RABBITMQ_HOST}
mp.messaging.outgoing.motoria-events-out.port=5672
mp.messaging.outgoing.motoria-events-out.username=${RABBITMQ_USER}
mp.messaging.outgoing.motoria-events-out.password=${RABBITMQ_PASSWORD}

# Dead-letter handling is configured through queue arguments only.
# The application sets x-dead-letter-exchange and x-dead-letter-routing-key on the main queues.
# The broker topology must be pre-provisioned; SmallRye does not auto-create the DLX or DLQ queues.
mp.messaging.incoming.listing-certification-requested-in.connector=smallrye-rabbitmq
mp.messaging.incoming.listing-certification-requested-in.exchange.name=motoria.events
mp.messaging.incoming.listing-certification-requested-in.queue.name=certification.listing-certification-requested
mp.messaging.incoming.listing-certification-requested-in.routing-keys=listing.certification.requested
mp.messaging.incoming.listing-certification-requested-in.host=${RABBITMQ_HOST}
mp.messaging.incoming.listing-certification-requested-in.port=5672
mp.messaging.incoming.listing-certification-requested-in.username=${RABBITMQ_USER}
mp.messaging.incoming.listing-certification-requested-in.password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.listing-certification-requested-in.failure-strategy=reject
mp.messaging.incoming.listing-certification-requested-in.queue.x-dead-letter-exchange=motoria.events.dlx
mp.messaging.incoming.listing-certification-requested-in.queue.x-dead-letter-routing-key=listing.certification.requested.dlq
mp.messaging.incoming.listing-notification-events-in.connector=smallrye-rabbitmq
mp.messaging.incoming.listing-notification-events-in.exchange.name=motoria.events
mp.messaging.incoming.listing-notification-events-in.queue.name=notification.listing-events
mp.messaging.incoming.listing-notification-events-in.routing-keys=listing.created,listing.published,listing.sold,listing.certification.requested
mp.messaging.incoming.listing-notification-events-in.host=${RABBITMQ_HOST}
mp.messaging.incoming.listing-notification-events-in.port=5672
mp.messaging.incoming.listing-notification-events-in.username=${RABBITMQ_USER}
mp.messaging.incoming.listing-notification-events-in.password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.listing-notification-events-in.failure-strategy=reject
mp.messaging.incoming.listing-notification-events-in.queue.x-dead-letter-exchange=motoria.events.dlx
mp.messaging.incoming.listing-notification-events-in.queue.x-dead-letter-routing-key=listing.notification.dlq

# Vehicle registry events (F1). Retry: the outbox re-publishes until the broker accepts the event, and the
# registry extraction consumer handles model failures itself (the case goes to the analyst with
# EXTRACTION_FAILED) instead of failing the message; anything that still fails is rejected to the DLQ.
mp.messaging.incoming.vehicle-registry-requested-in.connector=smallrye-rabbitmq
mp.messaging.incoming.vehicle-registry-requested-in.exchange.name=motoria.events
mp.messaging.incoming.vehicle-registry-requested-in.queue.name=vehicle.registry-requested
mp.messaging.incoming.vehicle-registry-requested-in.routing-keys=vehicle.registry.requested
mp.messaging.incoming.vehicle-registry-requested-in.host=${RABBITMQ_HOST}
mp.messaging.incoming.vehicle-registry-requested-in.port=5672
mp.messaging.incoming.vehicle-registry-requested-in.username=${RABBITMQ_USER}
mp.messaging.incoming.vehicle-registry-requested-in.password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.vehicle-registry-requested-in.failure-strategy=reject
mp.messaging.incoming.vehicle-registry-requested-in.queue.x-dead-letter-exchange=motoria.events.dlx
mp.messaging.incoming.vehicle-registry-requested-in.queue.x-dead-letter-routing-key=vehicle.registry.requested.dlq
mp.messaging.incoming.listing-vehicle-registry-completed-in.connector=smallrye-rabbitmq
mp.messaging.incoming.listing-vehicle-registry-completed-in.exchange.name=motoria.events
mp.messaging.incoming.listing-vehicle-registry-completed-in.queue.name=listing.vehicle-registry-completed
mp.messaging.incoming.listing-vehicle-registry-completed-in.routing-keys=vehicle.registry.completed
mp.messaging.incoming.listing-vehicle-registry-completed-in.host=${RABBITMQ_HOST}
mp.messaging.incoming.listing-vehicle-registry-completed-in.port=5672
mp.messaging.incoming.listing-vehicle-registry-completed-in.username=${RABBITMQ_USER}
mp.messaging.incoming.listing-vehicle-registry-completed-in.password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.listing-vehicle-registry-completed-in.failure-strategy=reject
mp.messaging.incoming.listing-vehicle-registry-completed-in.queue.x-dead-letter-exchange=motoria.events.dlx
mp.messaging.incoming.listing-vehicle-registry-completed-in.queue.x-dead-letter-routing-key=listing.vehicle-registry-completed.dlq
mp.messaging.incoming.notification-vehicle-registry-events-in.connector=smallrye-rabbitmq
mp.messaging.incoming.notification-vehicle-registry-events-in.exchange.name=motoria.events
mp.messaging.incoming.notification-vehicle-registry-events-in.queue.name=notification.vehicle-registry-events
mp.messaging.incoming.notification-vehicle-registry-events-in.routing-keys=vehicle.registry.review.required,vehicle.registry.completed,vehicle.registry.anomaly.detected
mp.messaging.incoming.notification-vehicle-registry-events-in.host=${RABBITMQ_HOST}
mp.messaging.incoming.notification-vehicle-registry-events-in.port=5672
mp.messaging.incoming.notification-vehicle-registry-events-in.username=${RABBITMQ_USER}
mp.messaging.incoming.notification-vehicle-registry-events-in.password=${RABBITMQ_PASSWORD}
mp.messaging.incoming.notification-vehicle-registry-events-in.failure-strategy=reject
mp.messaging.incoming.notification-vehicle-registry-events-in.queue.x-dead-letter-exchange=motoria.events.dlx
mp.messaging.incoming.notification-vehicle-registry-events-in.queue.x-dead-letter-routing-key=notification.vehicle-registry.dlq

%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.enable=false
quarkus.smallrye-openapi.info-title=Motoria.ai Backend API
quarkus.smallrye-openapi.info-version=1.0.0
motoria.rate-limit.requests-per-minute=100

motoria.outbox.dispatch.enabled=true
motoria.outbox.dispatch.every=5s
motoria.outbox.dispatch.batch-size=20
motoria.outbox.dispatch.claim-duration=PT30S
motoria.outbox.dispatch.retry-delay=PT30S

# ---------------------------------------------------------------------------------------------
# F1: identity, media, vehicle, ai. Keys and credentials only from the environment, never here.
# ---------------------------------------------------------------------------------------------
# Keyed hash shared by user and vehicle to compare identity numbers (base64, 32 bytes).
motoria.identity.hash-key=${MOTORIA_IDENTITY_HASH_KEY:}
# AES-256-GCM key for the identity number and type at rest (base64, 32 bytes).
motoria.user.crypto.key=${MOTORIA_USER_CRYPTO_KEY:}
motoria.user.identity.challenge-ttl=PT30M
motoria.user.identity.manual-daily-quota=50
motoria.user.identity.quota-zone=America/Costa_Rica
# Person registry by identity document: "stub" (dev and tests, never calls out) or "credid".
# The Credid token comes from the environment (MOTORIA_CREDID_TOKEN); never commit it. Until Motoria signs its own
# contract only the Credid TEST environment is used (task 0.1 of add-consulta-credid-personas).
motoria.user.person-registry.provider=${MOTORIA_PERSON_REGISTRY_PROVIDER:stub}
motoria.user.person-registry.credid.url=${MOTORIA_CREDID_URL:https://ws.credid.net/wstest/api/Reporte}
motoria.user.person-registry.credid.token=${MOTORIA_CREDID_TOKEN:}
motoria.user.person-registry.timeout=PT15S
# A check is reused for the same identity number while it is younger than this (each new query is paid).
motoria.user.person-registry.cache-ttl=P90D
# Maximum paid queries per day (America/Costa_Rica); the identity check degrades to UNAVAILABLE beyond it.
motoria.user.person-registry.daily-quota=200
# Consent text version in force (override per type with motoria.consent.text-version.<TYPE>).
motoria.consent.text-version=2026-11

# S3 storage. Credentials come from the AWS default chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or instance role).
motoria.media.s3.region=${MOTORIA_S3_REGION:us-east-1}
motoria.media.s3.bucket=${MOTORIA_S3_BUCKET:}
motoria.media.s3.public-bucket=${MOTORIA_S3_PUBLIC_BUCKET:}
motoria.media.s3.endpoint=${MOTORIA_S3_ENDPOINT:}
motoria.media.s3.path-style=${MOTORIA_S3_PATH_STYLE:false}
motoria.media.public-base-url=${MOTORIA_MEDIA_PUBLIC_BASE_URL:}
motoria.media.upload-url-ttl=PT10M
motoria.media.read-url-ttl=PT5M
motoria.media.default-country=CR
motoria.media.max-size.registry-document=10485760
motoria.media.max-size.identity-document=10485760
motoria.media.max-size.listing-photo=15728640
motoria.media.photo.min-width=1024
motoria.media.photo.min-height=768
motoria.media.pdf.max-pages=10
motoria.media.pdf.render-dpi=110

# Vehicle registry. Plate formats per country (validated with full match, after removing spaces and dashes).
motoria.vehicle.supported-countries=CR
motoria.vehicle.plate-pattern.CR=([0-9]{1,6}|[A-Z]{1,3}[0-9]{1,6})
motoria.vehicle.registry.min-confidence=0.85
motoria.vehicle.registry.document-max-age=P30D
motoria.vehicle.registry.required-attributes=BRAND,MODEL,YEAR,VIN,OWNER_ID_HASH
# Automatic approval stays off until precision is measured with the test set (design D4, task 4.5).
motoria.vehicle.registry.auto-approve-enabled=false
# Registry lookup by plate (add-consulta-credid-vehiculos): first option of the seller; the registry PDF is the fallback.
# provider: "stub" (dev and tests, never calls out) or "credid". Same token as the person registry (MOTORIA_CREDID_TOKEN).
# The Credid vehicle URL is still unknown (task 0.1 of add-consulta-credid-vehiculos): empty means not configured and the
# seller is sent to the PDF. Only the Credid TEST environment is used until Motoria signs its own contract.
motoria.vehicle.registry.provider=${MOTORIA_VEHICLE_REGISTRY_PROVIDER:stub}
motoria.vehicle.registry.credid.url=${MOTORIA_CREDID_VEHICLE_URL:}
motoria.vehicle.registry.credid.timeout=PT15S
# Agreement data is reused while it is younger than this (each new query is paid); the PDF keeps document-max-age.
motoria.vehicle.registry.agreement-max-age=P90D
# Agreement data with every required value is approved without the analyst (false sends it to the review tray).
motoria.vehicle.registry.agreement-auto-approve=true
# Maximum answered queries per provider and day (America/Costa_Rica); beyond it the seller uploads the PDF.
motoria.vehicle.registry.daily-quota=200
motoria.vehicle.registry.quota-zone=America/Costa_Rica
# Fee for "que Motoria lo obtenga" (owner gate 0.5). Empty means the option is not offered yet.
motoria.vehicle.registry-request.fee=${MOTORIA_REGISTRY_REQUEST_FEE:}
motoria.vehicle.registry-request.currency=CRC

# Listing (provinces, fuels and transmissions are enums: design D9.1 catalogs)
motoria.listing.default-currency=CRC

# AI model (owner gate 0.1). provider=stub (no external call, empty extraction, everything goes to the analyst)
# or provider=openai-compatible (generic HTTP chat-completions adapter).
motoria.ai.provider=${MOTORIA_AI_PROVIDER:stub}
motoria.ai.base-url=${MOTORIA_AI_BASE_URL:}
motoria.ai.model=${MOTORIA_AI_MODEL:stub-model}
motoria.ai.api-key=${MOTORIA_AI_API_KEY:}
motoria.ai.timeout=PT90S
# Some providers reject the temperature parameter; when false it is not sent.
motoria.ai.send-temperature=${MOTORIA_AI_SEND_TEMPERATURE:true}
motoria.ai.max-output-tokens=4000
motoria.ai.cost.input-per-1k=${MOTORIA_AI_COST_INPUT_PER_1K:0}
motoria.ai.cost.output-per-1k=${MOTORIA_AI_COST_OUTPUT_PER_1K:0}
motoria.ai.pdf.min-text-chars=200
